<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050713" />
    </radialGradient>

    <!-- Glowing Cyan / Indigo Gradients -->
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="electricPurpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hex Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#neonCyanGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Background Ambient Glow Aura -->
  <circle cx="256" cy="250" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glowEffect)" />
  <circle cx="256" cy="230" r="110" fill="#8b5cf6" opacity="0.15" filter="url(#glowEffect)" />

  <!-- Outer Cyber Tech Ring Elements -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="14 10 4 10" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="40 180" />

  <!-- Lynx / Cyber AI Stylized Origami Head & Diamond Core -->
  <g filter="url(#subtleGlow)">
    <!-- Left Lynx Ear -->
    <polygon points="170,95 210,190 145,215 130,125" fill="url(#electricPurpleGrad)" opacity="0.95" />
    <!-- Left Ear Tuft -->
    <polygon points="170,95 160,65 178,85" fill="#38bdf8" />

    <!-- Right Lynx Ear -->
    <polygon points="342,95 302,190 367,215 382,125" fill="url(#neonCyanGrad)" opacity="0.95" />
    <!-- Right Ear Tuft -->
    <polygon points="342,95 352,65 334,85" fill="#c084fc" />

    <!-- Forehead & Crown Facets -->
    <polygon points="256,130 210,190 256,230 302,190" fill="url(#coreGlow)" />
    <polygon points="256,130 170,95 210,190" fill="#4338ca" opacity="0.6" />
    <polygon points="256,130 342,95 302,190" fill="#0e7490" opacity="0.6" />

    <!-- Cheeks and Face Lateral Wings -->
    <polygon points="145,215 210,190 220,285 135,295" fill="url(#electricPurpleGrad)" />
    <polygon points="367,215 302,190 292,285 377,295" fill="url(#neonCyanGrad)" />

    <!-- Central Neural Diamond / Muzzle -->
    <polygon points="256,230 205,295 256,365 307,295" fill="url(#neonCyanGrad)" />
    <polygon points="256,245 220,295 256,345 292,295" fill="#090d16" />

    <!-- Center AI Glowing Core -->
    <polygon points="256,260 235,295 256,330 277,295" fill="url(#coreGlow)" filter="url(#subtleGlow)" />
    <circle cx="256" cy="295" r="7" fill="#ffffff" />

    <!-- Lower Jaw / Shield Point -->
    <polygon points="256,365 205,295 190,360 256,425" fill="url(#electricPurpleGrad)" opacity="0.9" />
    <polygon points="256,365 307,295 322,360 256,425" fill="url(#neonCyanGrad)" opacity="0.9" />
    <polygon points="256,375 225,360 256,410 287,360" fill="#090d16" />

    <!-- Lynx Eyes - Glowing Hex Tech -->
    <polygon points="190,240 230,245 215,260 180,250" fill="#22d3ee" filter="url(#subtleGlow)" />
    <polygon points="322,240 282,245 297,260 332,250" fill="#a855f7" filter="url(#subtleGlow)" />
    <circle cx="205" cy="248" r="3.5" fill="#ffffff" />
    <circle cx="307" cy="248" r="3.5" fill="#ffffff" />
  </g>

  <!-- Circuit Tech Accent Nodes -->
  <g opacity="0.8">
    <line x1="135" y1="295" x2="90" y2="330" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
    <circle cx="85" cy="334" r="5" fill="#c084fc" />

    <line x1="377" y1="295" x2="422" y2="330" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <circle cx="427" cy="334" r="5" fill="#38bdf8" />

    <line x1="256" y1="425" x2="256" y2="455" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="256" cy="460" r="5" fill="#22d3ee" />
  </g>
</svg>
